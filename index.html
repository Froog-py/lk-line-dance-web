<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Line Dance Library</title>
  <meta name="description" content="A personal line-dance song library — tag, organize, and jump to each song in Spotify." />
  <meta name="theme-color" content="#8F6FE2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Line Dance" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Birthday banner (today only — remove by setting SHOW_BIRTHDAY = false in app.js) -->
  <div id="birthday-overlay" class="overlay hidden" aria-hidden="true">
    <div class="birthday-card" role="dialog" aria-label="Birthday message">
      <div class="confetti" aria-hidden="true"></div>
      <button class="birthday-close" id="birthday-close" aria-label="Close">&times;</button>
      <div class="birthday-emoji" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="56" height="56" fill="none">
          <rect x="14" y="30" width="36" height="22" rx="4" fill="#CAB4F3"/>
          <rect x="14" y="30" width="36" height="8" rx="4" fill="#8F6FE2"/>
          <rect x="30" y="16" width="4" height="14" rx="2" fill="#CF9446"/>
          <circle cx="32" cy="14" r="3" fill="#CA7382"/>
        </svg>
      </div>
      <h2>Happy Birthday, Ana!</h2>
      <p>Here's your very own line dance library. Tap any song to open it in Spotify.</p>
      <button class="btn btn-primary" id="birthday-enter">Let's dance</button>
    </div>
  </div>

  <header class="app-header">
    <div class="app-header-row">
      <h1 class="app-title">Line Dance Library</h1>
      <div class="header-actions">
        <button class="icon-btn" id="menu-btn" aria-label="Export or import" title="Export / Import">
          <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <button class="icon-btn" id="add-btn" aria-label="Add a song" title="Add a song">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search by title or artist" autocomplete="off" />
    </div>
    <div class="filter-row" id="filter-row"></div>
  </header>

  <main id="list" class="list"></main>

  <p class="footer-note">
    Live song recognition and auto-updates are coming in the official App Store version.
  </p>

  <!-- Menu sheet -->
  <div id="menu-overlay" class="overlay hidden">
    <div class="sheet">
      <h3>Library</h3>
      <button class="sheet-row" id="export-btn">Export library (.json)</button>
      <button class="sheet-row" id="import-btn">Import library (.json)</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
      <button class="sheet-row sheet-cancel" data-close-menu>Cancel</button>
    </div>
  </div>

  <!-- Song detail / edit sheet -->
  <div id="detail-overlay" class="overlay hidden">
    <div class="sheet detail-sheet" id="detail-sheet"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
